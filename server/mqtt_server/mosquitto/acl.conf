# Access Control List for Mosquitto MQTT Broker
# This file controls which users can publish/subscribe to which topics

# GRK device can publish to all grk/* topics
user grk
topic write grk/#

# Python server can subscribe to all grk topics
user python_server
topic read grk/#
topic read $SYS/#

# Admin user can do everything 
user admin
topic readwrite #
topic read $SYS/#
