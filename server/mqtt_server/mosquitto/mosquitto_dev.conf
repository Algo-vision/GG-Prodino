# Mosquitto MQTT Broker Configuration for GRK Testing
# This configuration allows anonymous access for local development
# For production, enable authentication and TLS

# Listen on all interfaces for local network access
listener 1883 0.0.0.0

# Allow anonymous access for testing
# IMPORTANT: Disable this in production and use password_file instead
allow_anonymous true

# Logging configuration
log_dest file /var/log/mosquitto/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Persistence
persistence true
persistence_location /var/lib/mosquitto/

# Maximum queued messages
max_queued_messages 1000

# Message size limit (10MB)
message_size_limit 10485760

# ---------- AUTHENTICATION (commented out for testing) ----------
# Uncomment these lines to enable authentication:
# allow_anonymous false
# password_file /etc/mosquitto/passwd
# acl_file /etc/mosquitto/acl

# ---------- TLS/SSL (commented out for testing) ----------
# Uncomment and configure for production with TLS:
# listener 8883
# cafile /etc/mosquitto/ca_certificates/ca.crt
# certfile /etc/mosquitto/certs/server.crt
# keyfile /etc/mosquitto/certs/server.key
# require_certificate false
