# ===== GRK gateway: local broker for the board + TLS bridge to AWS IoT =====

# --- Local listener for the GRK board (plain MQTT, all interfaces, no auth) ---
listener 1883 0.0.0.0
allow_anonymous true

# More logging so we can see the bridge status
log_type all

# --- Bridge: forward board data up to AWS IoT Core over TLS ---
connection aws-bridge
address a21aufrn5hgzfe-ats.iot.eu-north-1.amazonaws.com:8883
bridge_protocol_version mqttv311
try_private false
# Auto-stamped per unit by grk-fetch-certs.py to grk-bridge-<serial> (unique
# AWS client id per gateway - required so a shared device cert works fleet-wide).
remote_clientid grk-bridge-UNCONFIGURED
cleansession true
notifications false
bridge_cafile /etc/mosquitto/certs/AmazonRootCA1.pem
bridge_certfile /etc/mosquitto/certs/device.crt
bridge_keyfile /etc/mosquitto/certs/device.key

# Forward everything the board publishes (grk/#) OUT to AWS
topic grk/# out 0
