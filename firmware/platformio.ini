; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Plain `pio run` only builds the real embedded firmware by default.
; The native test env is test-only - invoke it explicitly via `pio test -e native`.
default_envs = main

[env:main]
platform = atmelsam
board = mkrgsm1400
framework = arduino
lib_ldf_mode = deep
lib_deps =
	arduino-libraries/Ethernet@^2.0.2
	bblanchon/ArduinoJson@^7.4.2
	links2004/WebSockets@^2.7.0
	mikalhart/TinyGPSPlus@^1.1.0
	sparkfun/SparkFun u-blox GNSS v3@^3.1.1
	jandrassy/ArduinoOTA@^1.1.0
	Arduino
	cmaglie/FlashStorage@^1.0.0
	arduino-libraries/Arduino_DebugUtils@^1.5.0
	knolleary/PubSubClient@^2.8
	adafruit/Adafruit INA219@^1.2.3
build_src_filter = +<*.h> +<*.cpp> +<*.hpp> -<tls_test.cpp> -<crypto_bench.cpp> -<tls_http_test.cpp> -<roundrobin_test.cpp> -<bench_aead.cpp> -<bench_tls.cpp>
monitor_speed = 115200
; upload_protocol = custom
; upload_port = 192.168.1.198
; upload_command = python ota_uploader.py $SOURCE

; Host-native unit tests for hardware-free pure logic (calculations,
; IMU mount orientation, sanity checks, OCU connection state). Run with
; `pio test -e native` from this directory. Does NOT build/test anything
; that touches real I2C/EEPROM/UDP/HTTP hardware - see firmware/test/README.md.
; Tests #include the real source files directly by relative path rather
; than linking through lib/GG (lib_ignore below), since that library's
; other files (I2C/GPS/etc) have real Arduino hardware dependencies that
; don't exist on a native host build.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
lib_ignore = GG, ProDinoMKRZero, SSLClient

; ---------------------------------------------------------------------------
; Clean MQTT+TLS-only debug firmware (Option A feasibility). Builds ONLY
; tls_test.cpp - no HTTP/config/status/OCU. Flash with: pio run -e tls_test -t upload
; ---------------------------------------------------------------------------
[env:tls_test]
platform = atmelsam
board = mkrgsm1400
framework = arduino
lib_ldf_mode = deep
build_src_filter = -<*> +<tls_test.cpp>
lib_deps =
	arduino-libraries/Ethernet@^2.0.2
	knolleary/PubSubClient@^2.8
	arduino-libraries/ArduinoECCX08@^1.3.8
lib_ignore = GG
monitor_speed = 115200

; ---------------------------------------------------------------------------
; OFFLINE crypto benchmark - times the ECC handshake math on the CPU, no network.
; ---------------------------------------------------------------------------
[env:crypto_bench]
platform = atmelsam
board = mkrgsm1400
framework = arduino
lib_ldf_mode = deep
build_src_filter = -<*> +<crypto_bench.cpp>
lib_ignore = GG, ProDinoMKRZero
monitor_speed = 115200

; ---------------------------------------------------------------------------
; HTTP-during-crypto test: HTTP in a 5ms ISR, TLS crypto in the main loop.
; ---------------------------------------------------------------------------
[env:tls_http_test]
platform = atmelsam
board = mkrgsm1400
framework = arduino
lib_ldf_mode = deep
build_src_filter = -<*> +<tls_http_test.cpp>
lib_deps =
	arduino-libraries/Ethernet@^2.0.2
lib_ignore = GG
monitor_speed = 115200

; ---------------------------------------------------------------------------
; 50ms round-robin + TLS crypto, with free-RAM + timing prints.
; ---------------------------------------------------------------------------
[env:roundrobin_test]
platform = atmelsam
board = mkrgsm1400
framework = arduino
lib_ldf_mode = deep
build_src_filter = -<*> +<roundrobin_test.cpp>
lib_deps =
	arduino-libraries/Ethernet@^2.0.2
lib_ignore = GG
monitor_speed = 115200

; ===========================================================================
; STANDALONE HEAD-TO-HEAD BENCHMARKS. Two pure-software test firmwares, nothing
; else running, identical [SUMMARY] output so the two logs compare line for line.
;   1) pio run -e bench_aead -t upload   new: ChaCha20-Poly1305 -> local server
;      (server: python3 tools/ingest_test_server.py)
;   2) pio run -e bench_tls  -t upload   old: mutual TLS + MQTT -> AWS IoT
;      (server: AWS IoT Core)
; ===========================================================================
[env:bench_aead]
platform = atmelsam
board = mkrgsm1400
framework = arduino
lib_ldf_mode = deep
build_src_filter = -<*> +<bench_aead.cpp>
build_flags = -D BENCH_INTERVAL_MS=5000UL
	-D BENCH_HOST=\"192.168.1.169\" -D BENCH_PORT=8088
lib_deps =
	arduino-libraries/Ethernet@^2.0.2
	bblanchon/ArduinoJson@^7.4.2
lib_ignore = GG
monitor_speed = 115200

[env:bench_tls]
platform = atmelsam
board = mkrgsm1400
framework = arduino
lib_ldf_mode = deep
build_src_filter = -<*> +<bench_tls.cpp>
; 15 s: the handshake alone is ~10 s, so a 5 s cycle could never keep up.
build_flags = -D BENCH_INTERVAL_MS=15000UL
lib_deps =
	arduino-libraries/Ethernet@^2.0.2
	bblanchon/ArduinoJson@^7.4.2
	knolleary/PubSubClient@^2.8
lib_ignore = GG
monitor_speed = 115200

; ===========================================================================
; PHASE-0 BENCHMARK ENVS: same full firmware, only the telemetry path differs.
; Numbers from both are directly comparable ([BENCH] lines from telemetry_bench.hpp).
;   pio run -e main_tls  -t upload     old: TLS -> AWS IoT publish window
;   pio run -e main_aead -t upload     new: ChaCha20-Poly1305 -> plain HTTP POST
; ===========================================================================
[env:main_tls]
extends = env:main
build_flags = -D TELEMETRY_MODE_TLS -D TELEM_INTERVAL_MS=60000UL

; PRODUCTION telemetry path: encrypted packet straight to the EC2 dashboard
; server. 5 min interval: each send blocks loop() for ~97 ms (16 ms crypto +
; 78 ms TCP connect), so telemetry costs 0.03% of the board's time.
[env:main_aead]
extends = env:main
build_flags = -D TELEMETRY_MODE_AEAD -D TELEM_INTERVAL_MS=300000UL
	-D TELEM_HOST=\"16.171.11.151\" -D TELEM_PORT=5555 -D TELEM_TIMEOUT_MS=2000
