; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Plain `pio run` only builds the real embedded firmware by default.
; The native test env is test-only - invoke it explicitly via `pio test -e native`.
default_envs = main

[env:main]
platform = atmelsam
board = mkrgsm1400
framework = arduino
lib_ldf_mode = deep
lib_deps =
	arduino-libraries/Ethernet@^2.0.2
	bblanchon/ArduinoJson@^7.4.2
	links2004/WebSockets@^2.7.0
	mikalhart/TinyGPSPlus@^1.1.0
	sparkfun/SparkFun u-blox GNSS v3@^3.1.1
	jandrassy/ArduinoOTA@^1.1.0
	Arduino
	cmaglie/FlashStorage@^1.0.0
	arduino-libraries/Arduino_DebugUtils@^1.5.0
	adafruit/Adafruit INA219@^1.2.3
build_src_filter = +<*.h> +<*.cpp> +<*.hpp> -<bench_aead.cpp>
; Telemetry destination + cadence. The connection is held open, so a send only
; blocks loop() for the crypto plus the write - the ~78 ms TCP handshake is paid
; once at startup, not per send. 60 s is well inside the idle window the
; connection was measured to survive (300 s, tools/test_keepalive.py).
; Add -D TELEM_USE_UDP=1 to send a single datagram instead (no handshake and no
; connection to keep alive) - needs inbound UDP opened in the EC2 security group.
build_flags = -D TELEM_INTERVAL_MS=60000UL
	-D TELEM_HOST=\"16.171.11.151\" -D TELEM_PORT=5555 -D TELEM_TIMEOUT_MS=2000
monitor_speed = 115200
; upload_protocol = custom
; upload_port = 192.168.1.198
; upload_command = python ota_uploader.py $SOURCE

; Host-native unit tests for hardware-free pure logic (calculations,
; IMU mount orientation, sanity checks, OCU connection state). Run with
; `pio test -e native` from this directory. Does NOT build/test anything
; that touches real I2C/EEPROM/UDP/HTTP hardware - see firmware/test/README.md.
; Tests #include the real source files directly by relative path rather
; than linking through lib/GG (lib_ignore below), since that library's
; other files (I2C/GPS/etc) have real Arduino hardware dependencies that
; don't exist on a native host build.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
lib_ignore = GG, ProDinoMKRZero, BearSSL

; ===========================================================================
; Standalone telemetry benchmark: the encrypted-telemetry path with nothing else
; running (no HTTP server, no sensors), for measuring it in isolation.
;   pio run -e bench_aead -t upload   (server: python3 tools/ingest_test_server.py)
; The TLS twin it was compared against lives on the board-only-tls branch; the
; results are in docs/TELEMETRY_BENCHMARK.md.
; ===========================================================================
[env:bench_aead]
platform = atmelsam
board = mkrgsm1400
framework = arduino
lib_ldf_mode = deep
build_src_filter = -<*> +<bench_aead.cpp>
build_flags = -D BENCH_INTERVAL_MS=5000UL
	-D BENCH_HOST=\"192.168.1.169\" -D BENCH_PORT=8088
lib_deps =
	arduino-libraries/Ethernet@^2.0.2
	bblanchon/ArduinoJson@^7.4.2
lib_ignore = GG
monitor_speed = 115200
