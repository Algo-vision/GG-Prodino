# Access Control List for Mosquitto MQTT Broker
# This file controls which users can publish/subscribe to which topics

# Prodino device can publish to all prodino/* topics
user prodino
topic write prodino/#

# Python server can subscribe to all prodino topics
user python_server
topic read prodino/#
topic read $SYS/#

# Admin user can do everything 
user admin
topic readwrite #
topic read $SYS/#
